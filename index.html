<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Pirates Gamejam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        html,
        body {
            background-color: #fff;
            color: #000;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
        }

        .bubble {
            animation: float 6s ease-in-out infinite backwards;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(var(--tx), calc(-50% + var(--ty)));
            }

            50% {
                transform: translate(var(--tx), calc(-50% + var(--ty) - 10px));
            }
        }

        /* CSS-only seven-segment digit display */
        .seg-digit {
            position: relative;
            display: inline-block;
            vertical-align: middle;
            width: 0.62em;
            height: 1em;
            margin: 0 0.06em;
        }

        .seg {
            position: absolute;
            background: rgba(0, 0, 0, 0.08);
            transition: background 0.08s linear, box-shadow 0.08s linear;
        }

        .seg.on {
            background: #ef4444;
            box-shadow: 0 0 6px #ef4444, 0 0 18px rgba(239, 68, 68, 0.8);
        }

        .seg-h {
            clip-path: polygon(8% 0%, 92% 0%, 100% 50%, 92% 100%, 8% 100%, 0% 50%);
        }

        .seg-v {
            clip-path: polygon(0% 10%, 50% 0%, 100% 10%, 100% 90%, 50% 100%, 0% 90%);
        }

        .seg-a {
            top: 0%;
            left: 10%;
            width: 80%;
            height: 9%;
        }

        .seg-g {
            top: 45.5%;
            left: 10%;
            width: 80%;
            height: 9%;
        }

        .seg-d {
            top: 91%;
            left: 10%;
            width: 80%;
            height: 9%;
        }

        .seg-f {
            top: 4%;
            left: 0%;
            width: 13%;
            height: 43%;
        }

        .seg-b {
            top: 4%;
            right: 0%;
            width: 13%;
            height: 43%;
        }

        .seg-e {
            top: 53%;
            left: 0%;
            width: 13%;
            height: 43%;
        }

        .seg-c {
            top: 53%;
            right: 0%;
            width: 13%;
            height: 43%;
        }

        .seg-colon {
            display: inline-block;
            position: relative;
            width: 0.22em;
            height: 1em;
            vertical-align: middle;
        }

        .seg-colon::before,
        .seg-colon::after {
            content: '';
            position: absolute;
            left: 50%;
            width: 0.16em;
            height: 0.16em;
            margin-left: -0.08em;
            border-radius: 50%;
            background: #ef4444;
        }

        .seg-colon::before {
            top: 28%;
        }

        .seg-colon::after {
            top: 62%;
        }
    </style>
</head>

<body class="min-h-screen bg-white relative overflow-x-hidden md:overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(0,0,0,0.04)_0%,_rgba(255,255,255,1)_70%)]">
    </div>

    <div class="md:hidden relative flex flex-col items-center gap-6 px-4 pt-10 pb-32 min-h-screen">
        <h1 class="text-slate-700 text-3xl font-bold tracking-[0.15em] uppercase text-center">
            Coding Pirates Gamejam
        </h1>
        <div id="clock-mobile"
            class="clock-display text-5xl leading-none bg-white border-4 border-red-400 px-4 py-3 flex items-center justify-center">
        </div>
        <div id="bubbles-mobile" class="w-full flex flex-col gap-3"></div>
    </div>

    <div class="hidden md:contents">
        <h1
            class="absolute top-6 left-1/2 -translate-x-1/2 text-slate-700 text-3xl md:text-5xl font-bold tracking-[0.2em] uppercase text-center px-4">
            Coding Pirates Gamejam
        </h1>

        <div id="bubbles" class="absolute inset-0"></div>

        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="text-center">
                <div id="clock"
                    class="clock-display text-6xl sm:text-7xl md:text-8xl lg:text-9xl leading-none bg-white border-4 border-red-400 px-6 py-4 md:px-10 md:py-6 flex items-center justify-center">
                </div>
            </div>
        </div>
    </div>

    <button id="fab" type="button"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 w-16 h-16 bg-black text-white text-3xl font-bold border-2 border-black flex items-center justify-center hover:bg-slate-800 transition-colors">+</button>

    <div id="message-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center px-4">
        <div class="bg-white border-4 border-black w-full max-w-sm p-6 relative">
            <button id="message-close" type="button"
                class="absolute top-2 right-2 text-2xl leading-none px-2 hover:text-red-500">&times;</button>
            <h2 class="text-lg font-bold uppercase tracking-widest mb-4">Send en besked</h2>
            <form id="message-form" class="space-y-3">
                <input id="message-author" type="text" maxlength="30" required placeholder="Dit navn"
                    class="w-full border-2 border-black px-3 py-2 text-sm" />
                <textarea id="message-text" maxlength="200" required rows="3" placeholder="Din besked"
                    class="w-full border-2 border-black px-3 py-2 text-sm resize-none"></textarea>
                <p id="message-error" class="text-sm text-red-500"></p>
                <button type="submit"
                    class="w-full bg-black text-white font-bold uppercase tracking-widest py-2 hover:bg-slate-800 transition-colors">Send</button>
            </form>
        </div>
    </div>

    <script>
        const TARGET_DATE = new Date(2026, 6, 14, 12, 40, 0).getTime();
        const MAX_MS = 24 * 60 * 60 * 1000;

        const clockEls = document.querySelectorAll(".clock-display");

        const SEGMENTS = {
            "0": "abcdef",
            "1": "bc",
            "2": "abged",
            "3": "abgcd",
            "4": "fgbc",
            "5": "afgcd",
            "6": "afgecd",
            "7": "abc",
            "8": "abcdefg",
            "9": "abcdfg",
        };

        function pad2(n) {
            return String(n).padStart(2, "0");
        }

        function renderDigits(str) {
            const html = [...str].map((ch) => {
                if (ch === ":") return `<span class="seg-colon"></span>`;
                const lit = SEGMENTS[ch] || "";
                const segs = ["a", "b", "c", "d", "e", "f", "g"]
                    .map((s) => `<span class="seg seg-${s} seg-${"a,d,g".includes(s) ? "h" : "v"} ${lit.includes(s) ? "on" : ""}"></span>`)
                    .join("");
                return `<span class="seg-digit">${segs}</span>`;
            }).join("");
            clockEls.forEach((el) => {
                el.innerHTML = html;
            });
        }

        function updateClock() {
            let remaining = TARGET_DATE - Date.now();
            if (remaining < 0) remaining = 0;
            if (remaining > MAX_MS) remaining = MAX_MS;

            const totalSeconds = Math.floor(remaining / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            renderDigits(`${pad2(hours)}:${pad2(minutes)}:${pad2(seconds)}`);
        }

        updateClock();
        setInterval(updateClock, 1000);

        const bubblesEl = document.getElementById("bubbles");
        const bubbleColors = [
            "border-emerald-300 bg-emerald-50",
            "border-sky-300 bg-sky-50",
            "border-amber-300 bg-amber-50",
            "border-fuchsia-300 bg-fuchsia-50",
            "border-rose-300 bg-rose-50",
        ];

        let lastMessages = [];
        const PER_SIDE = 4;

        function randomColor() {
            return bubbleColors[Math.floor(Math.random() * bubbleColors.length)];
        }

        function placeBubble(msg, side, slot, i, width) {
            const y = ((slot + 1) / (PER_SIDE + 1)) * 100;
            const margin = window.innerWidth < 768 ? 16 : 32;

            const div = document.createElement("div");
            div.className = `bubble absolute border-2 ${randomColor()} backdrop-blur px-4 py-3 text-slate-800`;
            div.style.width = `${width}px`;
            div.style.setProperty("--tx", "0px");
            div.style.setProperty("--ty", "0px");
            div.style.top = `${y}%`;
            if (side === "left") {
                div.style.left = `${margin}px`;
            } else {
                div.style.right = `${margin}px`;
            }
            div.style.animationDelay = `${(i % 5) * 0.7}s`;

            const author = document.createElement("div");
            author.className = "text-xs font-semibold text-slate-500 mb-1 truncate";
            author.textContent = msg.author;

            const text = document.createElement("div");
            text.className = "text-sm break-words";
            text.textContent = msg.text;

            div.appendChild(author);
            div.appendChild(text);
            bubblesEl.appendChild(div);
        }

        function layoutBubbles(messages) {
            bubblesEl.innerHTML = "";

            const newest = [...messages]
                .sort((a, b) => b.sentAt - a.sentAt)
                .slice(0, PER_SIDE * 2);

            const width = Math.min(340, Math.max(160, window.innerWidth * 0.24));

            newest.forEach((msg, i) => {
                const side = i % 2 === 0 ? "left" : "right";
                const slot = Math.floor(i / 2);
                placeBubble(msg, side, slot, i, width);
            });
        }

        const mobileBubblesEl = document.getElementById("bubbles-mobile");

        function layoutMobileBubbles(messages) {
            mobileBubblesEl.innerHTML = "";

            const newest = [...messages]
                .sort((a, b) => b.sentAt - a.sentAt)
                .slice(0, PER_SIDE * 2);

            newest.forEach((msg) => {
                const div = document.createElement("div");
                div.className = `w-full border-2 ${randomColor()} px-4 py-3 text-slate-800`;

                const author = document.createElement("div");
                author.className = "text-xs font-semibold text-slate-500 mb-1 truncate";
                author.textContent = msg.author;

                const text = document.createElement("div");
                text.className = "text-sm break-words";
                text.textContent = msg.text;

                div.appendChild(author);
                div.appendChild(text);
                mobileBubblesEl.appendChild(div);
            });
        }

        async function fetchMessages() {
            try {
                const res = await fetch("/messages");
                const messages = await res.json();
                const ids = messages.map((m) => m.id).join(",");
                if (ids !== lastMessages.map((m) => m.id).join(",")) {
                    lastMessages = messages;
                    layoutBubbles(messages);
                    layoutMobileBubbles(messages);
                }
            } catch (err) {
                console.error("failed to fetch messages", err);
            }
        }

        fetchMessages();
        setInterval(fetchMessages, 60000);
        window.addEventListener("resize", () => layoutBubbles(lastMessages));

        const COOLDOWN_MS = 30 * 60 * 1000;
        const STORAGE_KEY = "gamejam_last_sent";

        const fab = document.getElementById("fab");
        const modal = document.getElementById("message-modal");
        const form = document.getElementById("message-form");
        const authorInput = document.getElementById("message-author");
        const textInput = document.getElementById("message-text");
        const errorEl = document.getElementById("message-error");
        const closeBtn = document.getElementById("message-close");

        if (window.location.hash === "#nofab") {
            fab.style.display = "none";
        }

        function getRemainingCooldown() {
            const last = Number(localStorage.getItem(STORAGE_KEY) || 0);
            const remaining = COOLDOWN_MS - (Date.now() - last);
            return remaining > 0 ? remaining : 0;
        }

        function formatCooldown(ms) {
            const totalSeconds = Math.ceil(ms / 1000);
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            return `${m}:${String(s).padStart(2, "0")}`;
        }

        function updateFabState() {
            const remaining = getRemainingCooldown();
            if (remaining > 0) {
                fab.disabled = true;
                fab.textContent = formatCooldown(remaining);
                fab.classList.add("opacity-50", "cursor-not-allowed", "text-sm");
                fab.classList.remove("text-3xl");
            } else {
                fab.disabled = false;
                fab.textContent = "+";
                fab.classList.remove("opacity-50", "cursor-not-allowed", "text-sm");
                fab.classList.add("text-3xl");
            }
        }

        function openModal() {
            errorEl.textContent = "";
            form.reset();
            modal.classList.remove("hidden");
            authorInput.focus();
        }

        function closeModal() {
            modal.classList.add("hidden");
        }

        fab.addEventListener("click", () => {
            if (fab.disabled) return;
            openModal();
        });

        closeBtn.addEventListener("click", closeModal);
        modal.addEventListener("click", (e) => {
            if (e.target === modal) closeModal();
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (getRemainingCooldown() > 0) return;

            const author = authorInput.value.trim();
            const text = textInput.value.trim();
            if (!author || !text) return;

            try {
                const res = await fetch("/messages", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ author, message: text }),
                });
                if (!res.ok) throw new Error("request failed");

                localStorage.setItem(STORAGE_KEY, String(Date.now()));
                closeModal();
                updateFabState();
            } catch (err) {
                errorEl.textContent = "Noget gik galt. Prøv igen.";
            }
        });

        updateFabState();
        setInterval(updateFabState, 1000);
    </script>
</body>

</html>
