<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CP Gamejam</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            font-family: 'Share Tech Mono', monospace;
        }
    </style>
</head>

<body class="min-h-screen bg-white text-slate-800 flex items-center justify-center px-4">
    <div class="w-full max-w-sm border-4 border-black p-6 space-y-4">
        <h1 class="text-lg font-bold uppercase tracking-widest">Admin login</h1>
        <form method="POST" action="/admin/login" class="space-y-3">
            <input type="password" name="password" required placeholder="Password" autofocus
                class="w-full border-2 border-black px-3 py-2 text-sm" />
            <button type="submit"
                class="w-full bg-black text-white font-bold uppercase tracking-widest py-2 hover:bg-slate-800 transition-colors">Log
                in</button>
        </form>
        <p id="login-error" class="text-sm text-red-500 hidden">Wrong password.</p>
    </div>

    <script>
        if (new URLSearchParams(window.location.search).get("error") === "1") {
            document.getElementById("login-error").classList.remove("hidden");
        }
    </script>
</body>

</html>
