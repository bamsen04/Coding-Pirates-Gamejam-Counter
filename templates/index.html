<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Pirates Gamejam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        html,
        body {
            background-color: #fff;
            color: #000;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
        }

        .bubble {
            animation: float 6s ease-in-out infinite backwards;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .clock-desktop {
            font-size: clamp(2rem, 4.5vw, 6rem);
        }

        /* CSS-only seven-segment digit display */
        .seg-digit {
            position: relative;
            display: inline-block;
            vertical-align: middle;
            width: 0.62em;
            height: 1em;
            margin: 0 0.06em;
        }

        .seg {
            position: absolute;
            background: rgba(0, 0, 0, 0.08);
            transition: background 0.08s linear, box-shadow 0.08s linear;
        }

        .seg.on {
            background: #ef4444;
            box-shadow: 0 0 6px #ef4444, 0 0 18px rgba(239, 68, 68, 0.8);
        }

        .seg-h {
            clip-path: polygon(8% 0%, 92% 0%, 100% 50%, 92% 100%, 8% 100%, 0% 50%);
        }

        .seg-v {
            clip-path: polygon(0% 10%, 50% 0%, 100% 10%, 100% 90%, 50% 100%, 0% 90%);
        }

        .seg-a {
            top: 0%;
            left: 10%;
            width: 80%;
            height: 9%;
        }

        .seg-g {
            top: 45.5%;
            left: 10%;
            width: 80%;
            height: 9%;
        }

        .seg-d {
            top: 91%;
            left: 10%;
            width: 80%;
            height: 9%;
        }

        .seg-f {
            top: 4%;
            left: 0%;
            width: 13%;
            height: 43%;
        }

        .seg-b {
            top: 4%;
            right: 0%;
            width: 13%;
            height: 43%;
        }

        .seg-e {
            top: 53%;
            left: 0%;
            width: 13%;
            height: 43%;
        }

        .seg-c {
            top: 53%;
            right: 0%;
            width: 13%;
            height: 43%;
        }

        .seg-colon {
            display: inline-block;
            position: relative;
            width: 0.22em;
            height: 1em;
            vertical-align: middle;
        }

        .seg-colon::before,
        .seg-colon::after {
            content: '';
            position: absolute;
            left: 50%;
            width: 0.16em;
            height: 0.16em;
            margin-left: -0.08em;
            border-radius: 50%;
            background: #ef4444;
        }

        .seg-colon::before {
            top: 28%;
        }

        .seg-colon::after {
            top: 62%;
        }
    </style>
</head>

<body class="min-h-screen bg-white relative overflow-x-hidden md:overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(0,0,0,0.04)_0%,_rgba(255,255,255,1)_70%)]">
    </div>

    <div class="md:hidden relative flex flex-col items-center gap-6 px-4 pt-10 pb-32 min-h-screen">
        <h1 class="text-slate-700 text-3xl font-bold tracking-[0.15em] uppercase text-center">
            Coding Pirates Gamejam
        </h1>
        <div id="clock-mobile"
            class="clock-display text-4xl leading-none bg-white border-4 border-red-400 px-4 py-3 flex items-center justify-center">
        </div>
        <div id="bubbles-mobile" class="w-full flex flex-col gap-3"></div>
    </div>

    <div
        class="hidden md:grid relative h-screen grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center gap-8 px-8 pt-28 pb-28">
        <h1
            class="absolute top-6 left-1/2 -translate-x-1/2 w-full text-slate-700 text-3xl md:text-5xl font-bold tracking-[0.2em] uppercase text-center px-4">
            Coding Pirates Gamejam
        </h1>

        <div id="bubbles-left" class="h-full min-w-0 flex flex-col justify-evenly items-start gap-4"></div>

        <div id="clock"
            class="rounded-xl clock-display clock-desktop leading-none bg-white border-4 border-red-400 px-10 py-6 flex items-center justify-center">
        </div>

        <div id="bubbles-right" class="h-full min-w-0 flex flex-col justify-evenly items-end gap-4"></div>
    </div>

    <button id="fab" type="button"
        class="rounded-xl fixed bottom-6 left-1/2 -translate-x-1/2 z-40 w-16 h-16 bg-black text-white text-3xl font-bold border-2 border-black flex items-center justify-center hover:bg-slate-800 transition-colors">+</button>

    <div id="message-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center px-4">
        <div class="bg-white border-4 border-black w-full max-w-sm p-6 relative">
            <button id="message-close" type="button"
                class="absolute top-2 right-2 text-2xl leading-none px-2 hover:text-red-500">&times;</button>
            <h2 class="text-lg font-bold uppercase tracking-widest mb-4">Send en besked</h2>
            <form id="message-form" class="space-y-3">

                    class="w-full border-2 border-black px-3 py-2 text-sm" />
                <textarea id="message-text" maxlength="200" required rows="3" placeholder="Din besked"
                    class="w-full border-2 border-black px-3 py-2 text-sm resize-none"></textarea>
                <p id="message-error" class="text-sm text-red-500"></p>
                <div class="cf-turnstile" data-sitekey="0x4AAAAAAFuH0h9YAh9IFnDd"></div>
                <button type="submit"
                    class="w-full bg-black text-white font-bold uppercase tracking-widest py-2 hover:bg-slate-800 transition-colors">Send</button>
            </form>
        </div>
    </div>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script>
        const TARGET_DATE = new Date(2027, 11 - 1, 1, 13, 0, 0).getTime();
        const MAX_MS = 24 * 60 * 60 * 1000 * 10000000;

        const clockEls = document.querySelectorAll(".clock-display");

        const SEGMENTS = {
            "0": "abcdef",
            "1": "bc",
            "2": "abged",
            "3": "abgcd",
            "4": "fgbc",
            "5": "afgcd",
            "6": "afgecd",
            "7": "abc",
            "8": "abcdefg",
            "9": "abcdfg",
        };

        function pad2(n) {
            return String(n).padStart(2, "0");
        }

        function renderDigits(str) {
            const html = [...str].map((ch) => {
                if (ch === ":") return `<span class="seg-colon"></span>`;
                const lit = SEGMENTS[ch] || "";
                const segs = ["a", "b", "c", "d", "e", "f", "g"]
                    .map((s) => `<span class="seg seg-${s} seg-${"a,d,g".includes(s) ? "h" : "v"} ${lit.includes(s) ? "on" : ""}"></span>`)
                    .join("");
                return `<span class="seg-digit">${segs}</span>`;
            }).join("");
            clockEls.forEach((el) => {
                el.innerHTML = html;
            });
        }

        function updateClock() {
            let remaining = TARGET_DATE - Date.now();
            if (remaining < 0) remaining = 0;
            if (remaining > MAX_MS) remaining = MAX_MS;

            const totalSeconds = Math.floor(remaining / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            renderDigits(`${pad2(days)}:${pad2(hours)}:${pad2(minutes)}:${pad2(seconds)}`);
        }

        updateClock();
        setInterval(updateClock, 1000);

        const bubblesLeftEl = document.getElementById("bubbles-left");
        const bubblesRightEl = document.getElementById("bubbles-right");
        const bubbleColors = [
            "border-emerald-300 bg-emerald-50",
            "border-sky-300 bg-sky-50",
            "border-amber-300 bg-amber-50",
            "border-fuchsia-300 bg-fuchsia-50",
            "border-rose-300 bg-rose-50",
        ];

        let lastMessages = [];
        const PER_SIDE = 4;

        function randomColor() {
            return bubbleColors[Math.floor(Math.random() * bubbleColors.length)];
        }

        function placeBubble(msg, side, i) {
            const div = document.createElement("div");
            div.className = `bubble w-full max-w-[340px] border-2 ${randomColor()} backdrop-blur px-4 py-3 text-slate-800`;
            div.style.animationDelay = `${(i % 5) * 0.7}s`;

            const author = document.createElement("div");
            author.className = "text-xs font-semibold text-slate-500 mb-1 truncate";
            author.textContent = msg.author;

            const text = document.createElement("div");
            text.className = "text-sm break-words";
            text.textContent = msg.text;

            div.appendChild(author);
            div.appendChild(text);
            (side === "left" ? bubblesLeftEl : bubblesRightEl).appendChild(div);
        }

        function layoutBubbles(messages) {
            bubblesLeftEl.innerHTML = "";
            bubblesRightEl.innerHTML = "";

            const newest = [...messages]
                .sort((a, b) => b.sentAt - a.sentAt)
                .slice(0, PER_SIDE * 2);

            newest.forEach((msg, i) => {
                const side = i % 2 === 0 ? "left" : "right";
                placeBubble(msg, side, i);
            });
        }

        const mobileBubblesEl = document.getElementById("bubbles-mobile");

        function layoutMobileBubbles(messages) {
            mobileBubblesEl.innerHTML = "";

            const newest = [...messages]
                .sort((a, b) => b.sentAt - a.sentAt)
                .slice(0, PER_SIDE * 2);

            newest.forEach((msg) => {
                const div = document.createElement("div");
                div.className = `w-full border-2 ${randomColor()} px-4 py-3 text-slate-800`;

                const author = document.createElement("div");
                author.className = "text-xs font-semibold text-slate-500 mb-1 truncate";
                author.textContent = msg.author;

                const text = document.createElement("div");
                text.className = "text-sm break-words";
                text.textContent = msg.text;

                div.appendChild(author);
                div.appendChild(text);
                mobileBubblesEl.appendChild(div);
            });
        }

        async function fetchMessages() {
            try {
                const res = await fetch("/messages");
                const messages = await res.json();
                const ids = messages.map((m) => m.id).join(",");
                if (ids !== lastMessages.map((m) => m.id).join(",")) {
                    lastMessages = messages;
                    layoutBubbles(messages);
                    layoutMobileBubbles(messages);
                }
            } catch (err) {
                console.error("failed to fetch messages", err);
            }
        }

        fetchMessages();
        setInterval(fetchMessages, 60000);

        const COOLDOWN_MS = 10 * 60 * 1000;
        const STORAGE_KEY = "gamejam_last_sent";

        const fab = document.getElementById("fab");
        const modal = document.getElementById("message-modal");
        const form = document.getElementById("message-form");
        const authorInput = document.getElementById("message-author");
        const textInput = document.getElementById("message-text");
        const errorEl = document.getElementById("message-error");
        const closeBtn = document.getElementById("message-close");

        if (window.location.hash === "#nofab") {
            fab.style.display = "none";
        }

        function getRemainingCooldown() {
            const last = Number(localStorage.getItem(STORAGE_KEY) || 0);
            const remaining = COOLDOWN_MS - (Date.now() - last);
            return remaining > 0 ? remaining : 0;
        }

        function formatCooldown(ms) {
            const totalSeconds = Math.ceil(ms / 1000);
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            return `${m}:${String(s).padStart(2, "0")}`;
        }

        function updateFabState() {
            const remaining = getRemainingCooldown();
            if (remaining > 0) {
                fab.disabled = true;
                fab.textContent = formatCooldown(remaining);
                fab.classList.add("opacity-50", "cursor-not-allowed", "text-sm");
                fab.classList.remove("text-3xl");
            } else {
                fab.disabled = false;
                fab.textContent = "+";
                fab.classList.remove("opacity-50", "cursor-not-allowed", "text-sm");
                fab.classList.add("text-3xl");
            }
        }

        function openModal() {
            errorEl.textContent = "";
            form.reset();
            modal.classList.remove("hidden");
            authorInput.focus();
        }

        function closeModal() {
            modal.classList.add("hidden");
        }

        fab.addEventListener("click", () => {
            if (fab.disabled) return;
            openModal();
        });

        closeBtn.addEventListener("click", closeModal);
        modal.addEventListener("click", (e) => {
            if (e.target === modal) closeModal();
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (getRemainingCooldown() > 0) return;

            const author = authorInput.value.trim();
            const text = textInput.value.trim();
            if (!author || !text) return;

            const turnstileToken = form.querySelector('[name="cf-turnstile-response"]')?.value;

            try {
                const res = await fetch("/messages", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ author, message: text, "cf-turnstile-response": turnstileToken }),
                });
                if (window.turnstile) window.turnstile.reset();
                if (!res.ok) throw new Error("request failed");

                localStorage.setItem(STORAGE_KEY, String(Date.now()));
                closeModal();
                updateFabState();
            } catch (err) {
                errorEl.textContent = "Noget gik galt. Prøv igen.";
            }
        });

        updateFabState();
        setInterval(updateFabState, 1000);

(() => {
    // Clean up an earlier version if this was pasted before
    if (window.__tickCtx) {
        window.__tickCtx.close();
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    window.__tickCtx = ctx;

    const unlock = () => {
        if (ctx.state === "suspended") {
            ctx.resume();
        }
    };
    window.addEventListener("click", unlock);
    window.addEventListener("keydown", unlock);
    window.addEventListener("touchstart", unlock);

    // Gentle compressor so everything stays smooth and never harsh
    const master = ctx.createDynamicsCompressor();
    master.threshold.value = -18;
    master.ratio.value = 4;

    const volume = ctx.createGain();
    volume.gain.value = 0.7;

    master.connect(volume);
    volume.connect(ctx.destination);

    // Warm lowpass bus for the fanfare so the sawtooth is not piercing
    const fanfareBus = ctx.createBiquadFilter();
    fanfareBus.type = "lowpass";
    fanfareBus.frequency.value = 3000;
    fanfareBus.connect(master);

    // One second of noise, reused by the tick click and the finale pop
    const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const noiseData = noiseBuffer.getChannelData(0);
    for (let i = 0; i < noiseData.length; i++) {
        noiseData[i] = Math.random() * 2 - 1;
    }

    // Simple enveloped note
    const note = (type, freq, start, duration, peak, destination) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(peak, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(gain);
        gain.connect(destination || master);
        osc.start(start);
        osc.stop(start + duration + 0.02);
    };

    const tick = () => {
        const now = ctx.currentTime;

        // Body: triangle wave dropping from 1200 Hz to 600 Hz
        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);
        oscGain.gain.setValueAtTime(0.0001, now);
        oscGain.gain.exponentialRampToValueAtTime(0.5, now + 0.002);
        oscGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
        osc.connect(oscGain);
        oscGain.connect(master);
        osc.start(now);
        osc.stop(now + 0.08);

        // Click: filtered noise burst on the attack
        const noise = ctx.createBufferSource();
        const noiseFilter = ctx.createBiquadFilter();
        const noiseGain = ctx.createGain();
        noise.buffer = noiseBuffer;
        noiseFilter.type = "bandpass";
        noiseFilter.frequency.value = 2200;
        noiseFilter.Q.value = 1.5;
        noiseGain.gain.setValueAtTime(0.35, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.012);
        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(master);
        noise.start(now);
        noise.stop(now + 0.02);
    };

    // Last 10 seconds: a beep on top of the tick, higher for the final 3
    const countdownBeep = (secondsLeft) => {
        const now = ctx.currentTime;
        if (secondsLeft <= 3) {
            note("square", 1320, now, 0.18, 0.25);
        } else {
            note("sine", 880, now, 0.12, 0.25);
        }
    };

    // At 00:00:00: cannon pop, low thump, rising fanfare, held chord, sparkles
    const finale = () => {
        const now = ctx.currentTime;

        const pop = ctx.createBufferSource();
        const popFilter = ctx.createBiquadFilter();
        const popGain = ctx.createGain();
        pop.buffer = noiseBuffer;
        popFilter.type = "lowpass";
        popFilter.frequency.setValueAtTime(6000, now);
        popFilter.frequency.exponentialRampToValueAtTime(300, now + 0.25);
        popGain.gain.setValueAtTime(0.9, now);
        popGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
        pop.connect(popFilter);
        popFilter.connect(popGain);
        popGain.connect(master);
        pop.start(now);
        pop.stop(now + 0.35);

        const thump = ctx.createOscillator();
        const thumpGain = ctx.createGain();
        thump.type = "sine";
        thump.frequency.setValueAtTime(160, now);
        thump.frequency.exponentialRampToValueAtTime(40, now + 0.25);
        thumpGain.gain.setValueAtTime(0.9, now);
        thumpGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
        thump.connect(thumpGain);
        thumpGain.connect(master);
        thump.start(now);
        thump.stop(now + 0.4);

        // Rising arpeggio: C5 E5 G5 C6
        const chord = [523.25, 659.25, 783.99, 1046.5];
        chord.forEach((freq, i) => {
            note("sawtooth", freq, now + 0.15 + i * 0.12, 0.25, 0.18, fanfareBus);
        });

        // Held final chord
        chord.forEach((freq) => {
            note("triangle", freq, now + 0.15 + chord.length * 0.12, 1.2, 0.2, fanfareBus);
        });

        // Sparkles that match the confetti rain
        for (let i = 0; i < 14; i++) {
            note("sine", 1800 + Math.random() * 2400, now + 0.3 + Math.random() * 1.4, 0.15, 0.08);
        }
    };

    if (!window.__originalRenderDigits) {
        window.__originalRenderDigits = window.renderDigits;
    }

    let lastStr = null;

    window.renderDigits = (str) => {
        window.__originalRenderDigits(str);

        if (ctx.state === "running") {
            if (str === "00:00:00:00") {
                // No tick at zero. Finale only on a live transition.
                if (lastStr !== null && lastStr !== "00:00:00:00") {
                    finale();
                }
            } else {
                const parts = str.split(":").map(Number);
                const total = parts[0] * 86400 + parts[1] * 3600 + parts[2] * 60 + parts[3];
                tick();
                if (total <= 10) {
                    countdownBeep(total);
                }
            }
        }

        lastStr = str;
    };

    console.log("Tick sound active. Click anywhere on the page once to enable audio.");
})();
    </script>
<script>
    (() => {
        const COLORS = ["#ef4444", "#f59e0b", "#10b981", "#0ea5e9", "#a855f7", "#ec4899", "#facc15"];
        const GRAVITY = 0.28;
        const DRAG = 0.985;

        const canvas = document.createElement("canvas");
        canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;";
        document.body.appendChild(canvas);
        const ctx = canvas.getContext("2d");

        let width = 0;
        let height = 0;
        const resize = () => {
            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        window.addEventListener("resize", resize);

        let particles = [];
        let rafId = null;
        let lastTime = 0;
        let rainUntil = 0;

        const spawn = (x, y, angle, speed, spread) => {
            const a = angle + (Math.random() - 0.5) * spread;
            const s = speed * (0.5 + Math.random() * 0.7);
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(a) * s,
                vy: Math.sin(a) * s,
                size: 6 + Math.random() * 8,
                color: COLORS[Math.floor(Math.random() * COLORS.length)],
                round: Math.random() < 0.25,
                rotation: Math.random() * Math.PI * 2,
                spin: (Math.random() - 0.5) * 0.3,
                tilt: Math.random() * Math.PI * 2,
                tiltSpeed: 0.1 + Math.random() * 0.2,
                life: 180 + Math.random() * 80
            });
        };

        const frame = (now) => {
            const dt = Math.min((now - lastTime) / 16.67, 3);
            lastTime = now;

            // Confetti rain from the top while the rain window is open
            if (now < rainUntil) {
                for (let i = 0; i < 3; i++) {
                    spawn(Math.random() * width, -20, Math.PI / 2, 3, 0.6);
                }
            }

            ctx.clearRect(0, 0, width, height);

            particles = particles.filter((p) => {
                p.vy += GRAVITY * dt;
                p.vx *= Math.pow(DRAG, dt);
                p.vy *= Math.pow(DRAG, dt);
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.rotation += p.spin * dt;
                p.tilt += p.tiltSpeed * dt;
                p.life -= dt;

                if (p.life <= 0 || p.y > height + 30) {
                    return false;
                }

                ctx.save();
                ctx.globalAlpha = Math.min(1, p.life / 40);
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.scale(1, Math.cos(p.tilt));
                ctx.fillStyle = p.color;
                if (p.round) {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                }
                ctx.restore();
                return true;
            });

            if (particles.length > 0 || now < rainUntil) {
                rafId = requestAnimationFrame(frame);
            } else {
                rafId = null;
                ctx.clearRect(0, 0, width, height);
            }
        };

        const launchConfetti = () => {
            // Two cannons from the bottom corners, aimed up and inward
            for (let i = 0; i < 90; i++) {
                spawn(0, height, -Math.PI / 2 + 0.55, 22, 0.6);
                spawn(width, height, -Math.PI / 2 - 0.55, 22, 0.6);
            }
            // Centre burst
            for (let i = 0; i < 50; i++) {
                spawn(width / 2, height * 0.6, -Math.PI / 2, 18, 1.6);
            }
            rainUntil = performance.now() + 1500;
            if (rafId === null) {
                lastTime = performance.now();
                rafId = requestAnimationFrame(frame);
            }
        };

        // Fire once when the clock goes from counting down to 00:00:00.
        // Loading the page after the timer already ended does not fire it.
        let lastStr = null;
        let fired = false;
        const originalRenderDigits = window.renderDigits;

        window.renderDigits = (str) => {
            originalRenderDigits(str);
            if (str === "00:00:00:00" && lastStr !== null && lastStr !== "00:00:00:00" && !fired) {
                fired = true;
                launchConfetti();
            }
            lastStr = str;
        };

        // Handy for testing from the console: launchConfetti();
        window.launchConfetti = launchConfetti;
    })();
</script>
