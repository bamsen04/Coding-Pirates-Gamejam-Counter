<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register passkey | CP Gamejam</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@simplewebauthn/browser@13.1.0/dist/bundle/index.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            font-family: 'Share Tech Mono', monospace;
        }
    </style>
</head>

<body class="min-h-screen bg-white text-slate-800 flex items-center justify-center px-4">
    <div class="w-full max-w-sm border-4 border-black p-6 space-y-4">
        <h1 class="text-lg font-bold uppercase tracking-widest">Register passkey</h1>
        <button id="register-btn" type="button"
            class="w-full bg-black text-white font-bold uppercase tracking-widest py-2 hover:bg-slate-800 transition-colors">Register
            passkey</button>
        <p id="status" class="text-sm text-red-500"></p>
    </div>

    <script>
        const token = new URLSearchParams(window.location.search).get("token");
        const statusEl = document.getElementById("status");
        const btn = document.getElementById("register-btn");

        async function post(url, body) {
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });
            if (!res.ok) throw new Error(res.status === 429 ? "Too many attempts. Try again later." : "Request failed (invalid or expired link?).");
            return res.json();
        }

        btn.addEventListener("click", async () => {
            statusEl.className = "text-sm text-red-500";
            statusEl.textContent = "";
            try {
                const optionsJSON = await post("/admin/enroll/options", { token });
                const response = await SimpleWebAuthnBrowser.startRegistration({ optionsJSON });
                await post("/admin/enroll/verify", { token, response });
                statusEl.className = "text-sm text-green-600";
                statusEl.textContent = "Passkey registered. You can now log in.";
                btn.disabled = true;
            } catch (err) {
                statusEl.textContent = err.message || "Registration failed.";
            }
        });
    </script>
</body>

</html>
